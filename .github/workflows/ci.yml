name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lxmf-rs

jobs:
  cargo-test:
    name: Cargo Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout lxmf-rs
        uses: actions/checkout@v6
        with:
          path: lxmf-rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lxmf-rs -> target

      - name: Run workspace tests
        run: timeout 15m cargo test --workspace -- --test-threads=1

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout lxmf-rs
        uses: actions/checkout@v6
        with:
          path: lxmf-rs

      - name: Install Rust with rustfmt
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt

      - name: Run rustfmt check
        run: cargo fmt --check

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout lxmf-rs
        uses: actions/checkout@v6
        with:
          path: lxmf-rs

      - name: Checkout rns-rs
        uses: actions/checkout@v6
        with:
          repository: lelloman/rns-rs
          ref: 32f697056661fbf7cf3f71db907cc313b69a677d
          path: rns-rs

      - name: Run Docker end-to-end suite
        run: tests/docker/run-all.sh

  lxmf-server-e2e:
    name: LXMF Server E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout lxmf-rs
        uses: actions/checkout@v6
        with:
          path: lxmf-rs

      - name: Checkout rns-rs
        uses: actions/checkout@v6
        with:
          repository: lelloman/rns-rs
          ref: 32f697056661fbf7cf3f71db907cc313b69a677d
          path: rns-rs

      - name: Run lxmf-server Docker scenario
        run: tests/docker/lxmf-server/run.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout lxmf-rs
        uses: actions/checkout@v6
        with:
          path: lxmf-rs

      - name: Install Rust with Clippy
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lxmf-rs -> target

      - name: Run Clippy
        run: bash scripts/lint-host.sh

  python-interop:
    name: Python LXMF Interop
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout lxmf-rs
        uses: actions/checkout@v6
        with:
          path: lxmf-rs

      # Upstream commits pinned to the reviewed baseline in UPSTREAM.md.
      - name: Checkout upstream LXMF
        uses: actions/checkout@v6
        with:
          repository: markqvist/LXMF
          ref: 101fd447815b4f4f699f8bb700e0df613f71efce
          path: LXMF

      - name: Checkout upstream Reticulum
        uses: actions/checkout@v6
        with:
          repository: markqvist/Reticulum
          ref: c5d205ffea16ef4519150745edf644dd03e48e5f
          path: Reticulum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lxmf-rs -> target

      - name: Install upstream Python dependencies
        run: python3 -m pip install cryptography pyserial

      - name: Run live interop against upstream Python LXMF
        run: LXMF_SRC=../LXMF RNS_SRC=../Reticulum timeout 15m tests/interop/run_live.sh
